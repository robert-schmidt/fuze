# Easiest: run `fuze mcp-config --tool codex` and paste what it prints: it fills in both paths for you.
# AI tools start MCP servers without your shell's PATH and with a filtered environment, so the command must be the
# full path of fuze, and FUZE_HOME must name the folder your agent uses (default: your home folder's .fuze).
# Add to ~/.codex/config.toml (or a trusted project's .codex/config.toml).
# Same as: codex mcp add fuze --env FUZE_HOME=/ABSOLUTE/PATH/TO/.fuze -- /ABSOLUTE/PATH/TO/.fuze-venv/bin/fuze mcp
# Then ask, for example: "what is FUZE doing?", "pause FUZE", "open the FUZE page" (the `ui` tool gives the address
# of the read-only page on this computer; start it with `fuze ui --open`).
[mcp_servers.fuze]
command = "/ABSOLUTE/PATH/TO/.fuze-venv/bin/fuze"
args = ["mcp"]
env = { FUZE_HOME = "/ABSOLUTE/PATH/TO/.fuze" }
